name: Bug report
description: Report a reproducible gameplay or compatibility problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the port. Do not upload APKs, WADs, shared libraries, saves, or private credentials.

  - type: input
    id: device
    attributes:
      label: Handheld
      description: Exact model, clone/revision, and RAM if known
      placeholder: R36S clone, 1 GB RAM
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware
      description: CFW/distribution name and version
      placeholder: ArkOS build and date
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Port release
      placeholder: 1.1.0
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the game
        2. Load slot 1
        3. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Launcher log
      description: Attach roms/ports/gtalcs/logs/launcher.log or paste only the relevant text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not attached copyrighted game files, saves, recovery phrases, private keys, or passwords.
          required: true
